[project]
name = "resale-agent"
version = "0.1.0"
description = "Deep research agent that suggests a competitive asking price for a secondhand item from live eBay listings and retail prices"
readme = "README.md"
authors = [
    { name = "JJ", email = "Junjunzhang1998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "google-cloud-aiplatform>=2.7.0",
    "httpx>=0.28.1",
    "openai-agents[litellm]>=0.24.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
# Tool tests run offline against recorded fixtures. Live API checks run only with: uv run pytest -m live
markers = ["live: calls the real eBay / SerpApi APIs (needs keys in .env and network)"]
addopts = "-m 'not live'"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

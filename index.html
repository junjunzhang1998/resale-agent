<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rummage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* Thrift store: kraft paper, marker price, typewriter labels, mustard / olive / rust / cream.
   Text is never rotated (rotated text renders soft on Windows): tilted shapes live on a
   text-free ::before layer behind an upright text layer. */
:root {
  --paper: #e8d9bd; --paper-dot: rgba(120, 90, 50, .07);
  --surface: #fbf6ea; --surface-2: #f3ead6; --manila: #f4e2b0; --manila-edge: #c9ad62;
  --ink: #2b2620; --ink-2: #3d352c; --muted: #5c5143; --line: #ddd0b6; --line-strong: #c9b896; --dash: #b9a682;
  --mustard: #d9a62e; --mustard-ink: #6f500a; --mustard-soft: #f6e4ae;
  --olive: #6b7a3a; --olive-ink: #45521d; --olive-soft: #e2e6c8;
  --rust: #b5532a; --rust-ink: #8f3a17; --rust-soft: #f4d9c9;
  --denim: #2e5f6b; --denim-soft: #d5e4e6; --plum: #6e3f60; --plum-soft: #ecdbe5;
  /* chart tokens the page script uses */
  --dot: #6b7a3a; --bar: #c9c29a; --bar-you: #b5532a; --accent-soft: rgba(217, 166, 46, .30); --accent-line: #c08f1c; --accent-ink: #8f3a17;
  --shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 16px rgba(70, 50, 20, .12);
  --hand: "Permanent Marker", "Segoe Print", "Bradley Hand", cursive;
  --type: "Courier Prime", "Courier New", ui-monospace, monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
/* Dark: a chalkboard with the same accents, lifted for contrast. The hang tag stays manila. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1e2925; --paper-dot: rgba(255, 255, 255, .03);
    --surface: #26332e; --surface-2: #2d3b35; --ink: #ece6d6; --ink-2: #d9d2c1; --muted: #b8b09e; --line: #3a4943; --line-strong: #4b5c55; --dash: #56685f;
    --mustard: #e7b84a; --mustard-ink: #f0c869; --mustard-soft: #4a3f22;
    --olive: #a9b86a; --olive-ink: #c2d084; --olive-soft: #36422a;
    --rust: #e0805a; --rust-ink: #f09a77; --rust-soft: #4a2e24;
    --denim: #8ab8c4; --denim-soft: #263f45; --plum: #d39cc0; --plum-soft: #45303f;
    --dot: #a9b86a; --bar: #4a5a4f; --bar-you: #e0805a; --accent-soft: rgba(231, 184, 74, .22); --accent-line: #e7b84a; --accent-ink: #f09a77;
    --shadow: 0 6px 18px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1e2925; --paper-dot: rgba(255, 255, 255, .03);
  --surface: #26332e; --surface-2: #2d3b35; --ink: #ece6d6; --ink-2: #d9d2c1; --muted: #b8b09e; --line: #3a4943; --line-strong: #4b5c55; --dash: #56685f;
  --mustard: #e7b84a; --mustard-ink: #f0c869; --mustard-soft: #4a3f22;
  --olive: #a9b86a; --olive-ink: #c2d084; --olive-soft: #36422a;
  --rust: #e0805a; --rust-ink: #f09a77; --rust-soft: #4a2e24;
  --denim: #8ab8c4; --denim-soft: #263f45; --plum: #d39cc0; --plum-soft: #45303f;
  --dot: #a9b86a; --bar: #4a5a4f; --bar-you: #e0805a; --accent-soft: rgba(231, 184, 74, .22); --accent-line: #e7b84a; --accent-ink: #f09a77;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
/* the composer bar is fixed: the page and scroll targets leave room for it (--composer-h is measured in JS) */
html { scroll-padding-bottom: calc(var(--composer-h, 84px) + 12px); }
body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--paper-dot) 1px, transparent 1.5px), radial-gradient(var(--paper-dot) 1px, transparent 1.5px);
  background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px;
  color: var(--ink); font: 15px/1.6 var(--sans); min-height: 100vh; display: flex; flex-direction: column;
  padding-bottom: calc(var(--composer-h, 84px) + 8px); -webkit-font-smoothing: antialiased;
}
a { color: var(--rust-ink); text-underline-offset: 2px; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2.5px solid var(--rust); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Header */
header { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 2px dashed var(--dash); }
.topbar { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
/* the swash under the wordmark is tilted; the wordmark itself stays upright */
.logo { position: relative; isolation: isolate; font-family: var(--hand); font-size: 28px; line-height: 1.1; color: var(--rust-ink); margin: 0; letter-spacing: .5px; padding: 0 4px; }
.logo::before { content: ""; position: absolute; z-index: -1; left: 0; right: 0; bottom: 3px; height: 9px; background: var(--mustard-soft); border-radius: 3px; transform: rotate(-2deg); }
.logo i { font-style: normal; color: var(--mustard); }
.tagline { font-family: var(--type); font-size: 13px; color: var(--muted); }
.btn {
  font-family: var(--type); font-size: 13.5px; font-weight: 700; background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px 12px; box-shadow: 2px 2px 0 var(--ink); white-space: nowrap;
}
.btn:hover { box-shadow: 3px 3px 0 var(--ink); }
.btn:active { box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--mustard); color: #2b2620; }
.btn:disabled { opacity: .55; cursor: default; }

main { flex: 1; width: 100%; max-width: 900px; margin: 0 auto; padding: 20px 16px 8px; }
#log { display: flex; flex-direction: column; gap: 18px; }
.msg.user { align-self: flex-end; max-width: 80%; }
.msg.bot { align-self: stretch; min-width: 0; }

/* the seller's note: a sticky note (upright) */
.bubble-user { background: var(--mustard-soft); color: var(--ink); padding: 10px 14px; border-radius: 3px; box-shadow: var(--shadow); border-left: 4px solid var(--mustard); white-space: pre-wrap; overflow-wrap: anywhere; }
/* agent text: a lined index card */
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 12px 16px;
  white-space: pre-wrap; overflow-wrap: anywhere; max-width: 640px; width: fit-content; line-height: 28px;
  background-image: linear-gradient(transparent 0 27px, var(--line) 27px 28px); background-size: 100% 28px; background-position: 0 6px; }
.bubble.error { border-color: var(--rust); background: var(--rust-soft); background-image: none; line-height: 1.5; }
.mini-trace { font-family: var(--type); margin-top: 6px; font-size: 13px; color: var(--muted); line-height: 1.5; }

/* Intro: an index card with a push pin */
.intro { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 24px 22px 20px; }
.intro::before { content: ""; position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #f09a77, #b5532a 60%, #6e2a10); box-shadow: 0 2px 3px rgba(0,0,0,.3); }
.intro h2 { font-family: var(--hand); font-weight: 400; font-size: 27px; margin: 0 0 8px; color: var(--rust-ink); letter-spacing: .3px; }
.intro p { margin: 0 0 10px; color: var(--ink-2); }
.intro ol { margin: 0 0 12px; padding-left: 22px; color: var(--ink-2); }
.intro li { margin: 4px 0; }
.intro .fine, .intro p.small { font-family: var(--type); font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { font-family: var(--type); font-size: 13.5px; text-align: left; background: var(--surface-2); border: 1.5px dashed var(--line-strong); border-radius: 6px; padding: 6px 11px; color: var(--ink); }
.chip:hover { border-color: var(--rust); border-style: solid; }

/* How it works: three cards taped to the board */
.how { margin-top: 26px; }
.how .label { font-family: var(--hand); font-size: 21px; color: var(--rust-ink); margin: 0 0 12px; }
.steps { display: grid; grid-template-columns: 1fr auto 1.25fr auto 1fr; gap: 10px; align-items: stretch; }
.step { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 18px 14px 14px; }
.step::before { content: ""; position: absolute; top: -8px; left: 50%; width: 54px; height: 16px; margin-left: -27px; background: rgba(217, 166, 46, .45); transform: rotate(-3deg); }
.step .n { font-family: var(--hand); font-size: 22px; line-height: 1; color: var(--rust-ink); }
.step h4 { margin: 4px 0 4px; font-size: 15px; font-weight: 650; }
.step p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.step .trio { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.step .trio span { font-family: var(--type); font-size: 12px; border: 1px dashed var(--line-strong); border-radius: 4px; padding: 0 6px; color: var(--ink-2); }
.arrow { align-self: center; font-family: var(--hand); color: var(--rust-ink); font-size: 22px; }

/* Loading */
.loading { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px 16px; box-shadow: var(--shadow); max-width: 640px; }
.loading .stage { font-family: var(--type); font-weight: 700; }
.spin { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 3px dotted var(--rust); animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Pills. A .sticker gets a colored, tilted paper layer behind upright text. */
.pill { position: relative; isolation: isolate; display: inline-flex; align-items: center; gap: 6px; font-family: var(--type); font-weight: 700; font-size: 13px; line-height: 1.2;
  padding: 5px 11px; border-radius: 999px; color: var(--ink); white-space: nowrap; }
.pill::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; border: 1.5px solid currentColor; background: var(--surface);
  box-shadow: 1px 1.5px 0 rgba(0,0,0,.18); transform: rotate(var(--tilt, 0deg)); }
.pill.coral { color: var(--rust-ink); } .pill.coral::before { background: var(--rust-soft); }
.pill.mustard { color: var(--mustard-ink); } .pill.mustard::before { background: var(--mustard-soft); }
.pill.sky { color: var(--denim); } .pill.sky::before { background: var(--denim-soft); }
.pill.sage { color: var(--olive-ink); } .pill.sage::before { background: var(--olive-soft); }
.pill .lvl { display: inline-flex; gap: 2px; }
.pill .lvl b { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .3; }
.pill .lvl b.on { opacity: 1; }
.pills { display: flex; flex-wrap: wrap; gap: 9px 8px; }
.pills .pill { font-weight: 400; white-space: normal; }
.pills .pill b { font-weight: 700; }

/* Hang tag: the manila paper (with its hole and offset edge) is the tilted ::before / ::after;
   the price and buttons sit upright on top. Colors are fixed: the tag is manila in both modes. */
.tagwrap { position: relative; padding: 22px 0 6px 34px; }
.string { position: absolute; left: 0; top: 0; width: 80px; height: 74px; overflow: visible; pointer-events: none; }
.tag { position: relative; isolation: isolate; max-width: 560px; padding: 20px 22px 20px 64px; color: #2b2620;
  --rust-soft: #f6dccd; --rust-ink: #8f3214; --mustard-soft: #f8e7b5; --mustard-ink: #6b4c08; --olive-soft: #e3e8c6; --olive-ink: #3f4c1a; --denim-soft: #d5e4e6; --denim: #2e5f6b; }
.tag::before, .tag::after { content: ""; position: absolute; inset: 0; transform: rotate(-1.6deg); transform-origin: left center;
  clip-path: polygon(34px 0, 100% 0, 100% 100%, 34px 100%, 0 calc(100% - 34px), 0 34px); }
.tag::before { z-index: -1;
  background: radial-gradient(circle at 26px 50%, var(--paper) 0 8px, #e2cb8c 8px 10.5px, #f4e2b0 10.5px) ; }
.tag::after { z-index: -2; background: #b99a4f; translate: 3px 4px; opacity: .55; }
.tag .eyebrow { font-family: var(--type); font-weight: 700; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: #5e4d24; }
.tag .price { font-family: var(--hand); font-size: 48px; line-height: 1.1; color: #8f3214; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
.tag .item { font-family: var(--type); font-size: 14px; color: #3d3220; }
.tag .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.tag .pill::before { background: #fbf3dc; }
.tag .btn { background: #fbf3dc; color: #2b2620; border-color: #2b2620; box-shadow: 2px 2px 0 #2b2620; }
.tag .btn.primary { background: #d9a62e; }
.disclaimer { font-family: var(--type); font-size: 13px; color: var(--muted); margin: 10px 0 0 34px; }

/* Receipt dividers */
.rule { border: 0; border-top: 2px dashed var(--dash); margin: 20px 0 6px; }
.divider { border: 0; border-top: 2px dashed var(--line-strong); margin: 16px 0; }

/* Trace summary strip: a receipt line */
.strip-link { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; width: 100%; margin: 14px 0 0; text-align: left;
  font-family: var(--type); font-size: 14px; color: var(--ink); background: var(--surface); border: 1.5px dashed var(--line-strong); border-radius: 4px; padding: 9px 12px; }
.strip-link:hover { border-color: var(--rust); border-style: solid; }
.strip-link .sep { color: var(--line-strong); }
.strip-link .go { margin-left: auto; color: var(--rust-ink); font-weight: 700; white-space: nowrap; }

/* Memo: a receipt with a torn bottom edge */
.memo-body { position: relative; background: var(--surface); margin-top: 16px; padding: 20px 22px 26px; box-shadow: var(--shadow); border-radius: 3px 3px 0 0; }
.memo-body::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px;
  background: linear-gradient(-45deg, transparent 7px, var(--surface) 0) 0 0 / 14px 10px repeat-x, linear-gradient(45deg, transparent 7px, var(--surface) 0) 0 0 / 14px 10px repeat-x; }
.memo-body h3, .section-title { font-family: var(--type); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.headline { font-size: 18px; font-weight: 650; line-height: 1.45; margin: 0 0 12px; color: var(--ink); }
.memo-body p { margin: 0 0 10px; color: var(--ink-2); }
.memo-body ul { margin: 0 0 4px; padding-left: 20px; color: var(--ink-2); }
.memo-body li { margin: 5px 0; }
.confline { font-family: var(--type); font-size: 14px; color: var(--muted); }
.assumed { font-family: var(--type); font-size: 13.5px; background: var(--mustard-soft); border-left: 4px solid var(--mustard); padding: 8px 12px; margin-top: 12px; color: var(--ink); }
.assumed ul { margin: 4px 0 0; padding-left: 18px; }
.assumed li { margin: 2px 0; }
.cites { white-space: nowrap; }
a.cite { display: inline-block; font-family: var(--type); font-size: 11.5px; font-weight: 700; line-height: 1; padding: 2px 5px; border-radius: 3px;
  background: var(--olive-soft); color: var(--olive-ink); border: 1px solid var(--olive); text-decoration: none; vertical-align: 1px; }
a.cite:hover { background: var(--olive); color: var(--surface); }
.cites .sep { color: var(--muted); font-size: 11px; padding: 0 2px; }

/* Draft listing */
.draft { margin-top: 16px; background: var(--surface-2); border: 1.5px solid var(--line-strong); border-radius: 4px; padding: 14px 16px; }
.draft .dtitle { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.draft .desc { font-family: var(--type); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; border-radius: 3px; margin: 8px 0; color: var(--ink); }
.draft .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Folded sections */
details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; margin-top: 12px; box-shadow: var(--shadow); }
details.fold > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "+"; font-family: var(--type); font-weight: 700; color: var(--rust-ink); width: 12px; }
details.fold[open] > summary::before { content: "–"; }
details.fold > summary .section-title { margin: 0; color: var(--ink); }
details.fold > summary .peek { font-family: var(--type); font-size: 13px; color: var(--muted); }
.foldbody { padding: 0 16px 16px; }

.funnel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 12px; }
.funnel div { font-family: var(--type); background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 8px 10px; }
.funnel b { display: block; font-size: 22px; }
.funnel span { font-size: 12.5px; color: var(--muted); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--type); font-size: 12px; fill: var(--muted); }
.chart .lbl { fill: var(--ink); }
.chart .you { fill: var(--rust-ink); font-weight: 700; }
.chart .acc { fill: var(--rust-ink); font-weight: 700; }
.legend { font-family: var(--type); font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; }

.tablewrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px dashed var(--line-strong); vertical-align: middle; }
th { font-family: var(--type); color: var(--muted); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--type); white-space: nowrap; }
td.title { min-width: 160px; }
td.title a { color: var(--ink); text-decoration: none; }
td.title a:hover { color: var(--rust-ink); text-decoration: underline; }
.thumb { width: 46px; height: 46px; border-radius: 3px; object-fit: cover; display: block; background: var(--surface-2); border: 1px solid var(--line); }
.mini { font-family: var(--type); font-size: 11.5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 4px; margin-left: 4px; white-space: nowrap; }
.srclist { margin: 0; padding: 0; list-style: none; font-size: 14px; }
.srclist li { padding: 6px 0; border-bottom: 1px dashed var(--line-strong); overflow-wrap: anywhere; }
.warn { font-family: var(--type); font-size: 13.5px; background: var(--rust-soft); border-left: 4px solid var(--rust); padding: 7px 10px; margin-bottom: 10px; }

/* Trace card */
details.trace { margin-top: 16px; background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--line-strong); scroll-margin-top: 80px; }
details.trace > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 2px solid transparent; }
details.trace[open] > summary { border-bottom: 2px dashed var(--dash); }
details.trace > summary::-webkit-details-marker { display: none; }
details.trace > summary h3 { font-family: var(--hand); font-weight: 400; font-size: 22px; margin: 0; color: var(--rust-ink); }
details.trace > summary .peek { font-family: var(--type); font-size: 13.5px; color: var(--muted); }
details.trace > summary .chev { margin-left: auto; font-family: var(--type); font-weight: 700; color: var(--rust-ink); }
.tracebody { padding: 14px 16px 16px; }
.trace-note { font-family: var(--type); font-size: 13.5px; background: var(--mustard-soft); border-left: 4px solid var(--mustard); padding: 8px 12px; margin-bottom: 14px; color: var(--ink); }
.group { margin-bottom: 14px; }
.group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.group-head .small { font-family: var(--type); }
.agent { display: inline-flex; align-items: center; gap: 6px; font-family: var(--type); font-weight: 700; font-size: 13px; padding: 3px 9px; border-radius: 3px; border: 1.5px solid currentColor; }
.agent .sym { font-size: 10px; }
.agent.lead { color: var(--rust-ink); background: var(--rust-soft); }
.agent.exact_comps { color: var(--olive-ink); background: var(--olive-soft); }
.agent.condition_tiers { color: var(--denim); background: var(--denim-soft); }
.agent.retail { color: var(--mustard-ink); background: var(--mustard-soft); }
.agent.writer { color: var(--plum); background: var(--plum-soft); }
.entry { border-left: 3px solid var(--line-strong); margin: 0 0 6px 6px; padding: 3px 0 3px 10px; font-size: 14px; }
.entry.tool { border-left-color: var(--olive); }
.entry .name { font-family: var(--type); font-weight: 700; }
.kind { font-family: var(--type); font-size: 11px; font-weight: 700; border-radius: 3px; padding: 1px 6px; margin-left: 6px; text-transform: uppercase; letter-spacing: .05em; }
.kind.tool { background: var(--olive); color: var(--surface); }
.kind.step { color: var(--muted); border: 1px solid var(--line-strong); }
.entry details summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
.entry pre { font-family: var(--type); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 3px; padding: 8px; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0; }

/* Replay */
.replay { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--line-strong); padding: 14px 16px; }
.replay-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.replay-head h3 { font-family: var(--hand); font-weight: 400; font-size: 21px; margin: 0; color: var(--rust-ink); }
.replay-head a { margin-left: auto; font-family: var(--type); font-size: 13.5px; font-weight: 700; }
.rcard { font-size: 14px; background: var(--surface-2); border: 1.5px solid var(--line-strong); border-radius: 4px; padding: 10px 12px; opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; }
.rcard.on { opacity: 1; transform: none; }
.rcard .agent { margin-bottom: 6px; }
.rcard .q { font-family: var(--type); color: var(--muted); overflow-wrap: anywhere; font-size: 13px; }
.rcard .n { font-family: var(--type); font-weight: 700; margin-top: 4px; }
.rcard .n .k { font-size: 18px; }
.meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--olive); transition: width .8s ease-out; }
.rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.rarrow { text-align: center; font-family: var(--type); color: var(--muted); font-size: 12.5px; opacity: 0; transition: opacity .3s; }
.rarrow.on { opacity: 1; }

/* Composer: fixed, solid kraft, receipt edge on top */
footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 2px dashed var(--dash); }
form { max-width: 900px; margin: 0 auto; padding: 12px 16px 14px; display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; min-width: 0; resize: none; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--ink); border-radius: 6px;
  padding: 10px 12px; min-height: 46px; max-height: 160px; box-shadow: 2px 2px 0 var(--ink); }
textarea:focus { outline: none; box-shadow: 3px 3px 0 var(--rust); border-color: var(--rust); }
textarea::placeholder { color: var(--muted); }
form .btn { height: 46px; padding: 0 18px; font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  .spin { animation-duration: 4s; }
  .rcard, .rarrow, .meter i { transition: none; }
}
@media (max-width: 640px) {
  .tagline { display: none; }
  .logo { font-size: 24px; }
  .intro { padding: 20px 16px 16px; }
  .intro h2 { font-size: 23px; }
  .steps { grid-template-columns: 1fr; gap: 14px; }
  .arrow { justify-self: center; line-height: 1; }
  .arrow::after { content: ""; }
  .tagwrap { padding-left: 22px; }
  .tag { padding: 18px 14px 18px 56px; }
  .tag .price { font-size: 38px; }
  .disclaimer { margin-left: 22px; }
  .memo-body { padding: 16px 14px 24px; }
  .rgrid { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
  .funnel b { font-size: 18px; }
  .msg.user { max-width: 90%; }
  .strip-link .go { margin-left: 0; flex-basis: 100%; }
  .strip-link .sep { display: none; }
  .strip-link > span:not(.go):not(.sep):not(:first-child)::before { content: "· "; color: var(--muted); }
  .foldbody { padding: 0 14px 14px; }
  .tablewrap { margin: 0 -14px; padding: 0 14px; }
}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="grow">
      <p class="logo">Rummage<i>.</i></p>
      <span class="tagline">Fair asking prices for secondhand finds</span>
    </div>
    <button class="btn" id="theme" type="button" aria-label="Switch light or dark theme">Theme</button>
    <button class="btn" id="reset" type="button">New item</button>
  </div>
</header>

<main>
  <div id="log" aria-live="polite"></div>
</main>

<footer>
  <form id="form">
    <label class="sr" for="input">Describe your item</label>
    <textarea id="input" rows="1" placeholder="Your item and its condition"></textarea>
    <button class="btn primary" id="send" type="submit">Price it</button>
  </form>
</footer>

<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const send = document.getElementById("send");
let sessionId = null;
let busy = false;
let answers = 0;  // memos shown this session: the first one opens its trace

const EXAMPLES = [
  "Used AirPods Pro 2, good condition, with charging case",
  "iPhone 13 Pro 128GB unlocked, used with light scratches",
  "Chanel Classic Flap medium, black caviar leather, gold hardware, used in good condition",
  "I want to sell my iPhone",
];
const AGENTS = {
  lead: { label: "Lead", sym: "◆" },
  "researcher:exact_comps": { label: "Researcher · exact comps", sym: "●" },
  "researcher:condition_tiers": { label: "Researcher · condition tiers", sym: "●" },
  "researcher:retail": { label: "Researcher · retail", sym: "●" },
  writer: { label: "Writer", sym: "✎" },
};
const CONDITIONS = { new: "New", open_box: "Open box", like_new: "Like new", used: "Used", refurbished: "Refurbished", for_parts: "For parts" };

// --- helpers ---
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = x => x == null ? "?" : "$" + Number(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const price = x => x == null ? "?" : Number.isInteger(+x) ? "$" + Number(x).toLocaleString("en-US") : money(x);
const plural = (n, word, many = word + "s") => `${n} ${n === 1 ? word : many}`;
const json = s => { try { return typeof s === "string" ? JSON.parse(s) : s; } catch { return null; } };
const agentInfo = a => AGENTS[a] || { label: a, sym: "●" };
const agentPill = a => { const i = agentInfo(a); return `<span class="agent ${a.replace("researcher:", "")}"><span class="sym" aria-hidden="true">${i.sym}</span>${esc(i.label)}</span>`; };
const realNewlines = s => String(s ?? "").replace(/\\r\\n|\\n/g, "\n");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function scrollDown() { window.scrollTo({ top: document.body.scrollHeight, behavior: reduced ? "auto" : "smooth" }); }
async function copy(text, btn, label) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch { btn.textContent = "Copy failed"; }
  setTimeout(() => { btn.textContent = label; }, 1500);
}

// [E2][E8] -> two links with a separator. Text is escaped first; unknown ids are dropped.
function cite(text, m) {
  const find = id => m.sources?.[id] || (m.comps || []).find(c => c.id === id) || (m.retail || []).find(r => r.id === id);
  return esc(text).replace(/(?:\[[ER]\d+\]\s*)+/g, run => {
    const links = (run.match(/[ER]\d+/g) || []).filter((id, i, all) => all.indexOf(id) === i).map(id => {
      const s = find(id);
      return s ? `<a class="cite" href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(`${s.title} · ${money(s.price)}`)}">${id}</a>` : "";
    }).filter(Boolean);
    const trailing = /\s$/.test(run) ? " " : "";
    return links.length ? `<span class="cites">${links.join('<span class="sep">,</span>')}</span>${trailing}` : trailing;
  });
}

// --- chat log ---
function addUser(text) { const m = el("div", "msg user"); m.append(el("div", "bubble-user", esc(text))); log.append(m); scrollDown(); }
function addBot(node) { const m = el("div", "msg bot"); m.append(node); log.append(m); scrollDown(); return m; }
function addText(text, cls = "") { return addBot(el("div", "bubble " + cls, esc(text))); }

function intro() {
  const w = el("section", "intro");
  w.innerHTML = `<h2>What are you selling?</h2>
    <p><b>Rummage is for casual resellers</b> putting an item up on eBay, Depop, Mercari or Facebook Marketplace. It suggests a
    <b>competitive asking price</b> from live eBay listings and current retail prices, and cites every listing it used.</p>
    <ol>
      <li><b>Describe the item:</b> brand and model, plus storage, carrier or size if it changes the price.</li>
      <li><b>Say its condition</b> (new, open box, used with light scratches, for parts) and what's included.</li>
      <li><b>Give it about 30 seconds.</b> If a detail is missing, it asks you first.</li>
    </ol>
    <p class="small muted">An asking-price suggestion from active listings, not a prediction of what it will sell for.</p>`;
  const chips = el("div", "chips");
  for (const ex of EXAMPLES) {
    const b = el("button", "chip", esc(ex));
    b.type = "button";
    b.onclick = () => ask(ex);
    chips.append(b);
  }
  w.append(chips);
  const how = el("section", "how", `<p class="label">How it works</p>
    <div class="steps">
      <div class="step"><div class="n">01</div><h4>Lead</h4><p>Reads your item, asks if something that changes the price is missing, and plans the search.</p></div>
      <div class="arrow" aria-hidden="true">→</div>
      <div class="step"><div class="n">02</div><h4>3 researchers, in parallel</h4><p>Each searches on its own and filters out accessories, parts and other models.</p>
        <div class="trio"><span>exact comps</span><span>other conditions</span><span>retail prices</span></div></div>
      <div class="arrow" aria-hidden="true">→</div>
      <div class="step"><div class="n">03</div><h4>Writer</h4><p>Drafts the price memo. Code checks every number and citation against the listings.</p></div>
    </div>`);
  const wrap = el("div");
  wrap.append(w, how);
  log.append(wrap);
}

// No streaming: the stage text follows the pipeline's usual timing while /chat runs.
const STAGES = [
  [0, "Reading your item", "Checking it's specific enough to price"],
  [3, "Researchers are searching", "Exact comps, other conditions and retail prices, at the same time"],
  [10, "Filtering listings", "Dropping accessories, parts, lots and other models, then reviewing every title"],
  [20, "Writing the memo", "Drafting the price range and checking every citation"],
  [45, "Digging deeper", "Too few comps or no retail price: researchers are broadening the search"],
];
function loading() {
  const box = el("div", "loading", `<div class="spin" role="status" aria-label="Researching"></div><div><div class="stage"></div><div class="sub small muted"></div></div>`);
  const node = addBot(box);
  const start = Date.now();
  const tick = () => {
    const s = (Date.now() - start) / 1000;
    const [, stage, sub] = STAGES.filter(([t]) => s >= t).pop();
    box.querySelector(".stage").textContent = `${stage}… ${Math.floor(s)}s`;
    box.querySelector(".sub").textContent = sub;
  };
  tick();
  const timer = setInterval(tick, 500);
  return () => { clearInterval(timer); node.remove(); };
}

async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; send.disabled = true;
  input.value = ""; autosize();
  addUser(text);
  const done = loading();
  const abort = new AbortController();
  const timeout = setTimeout(() => abort.abort(), 295000);
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }), signal: abort.signal });
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    const data = await res.json();
    sessionId = data.session_id;
    done();
    if (data.memo) {
      answers += 1;
      await replay(data.tool_calls, data.memo);
      addBot(renderMemo(data.memo, data.tool_calls, answers === 1));
    } else {
      const failed = data.response.startsWith("Research failed");
      const m = addText(data.response, failed ? "error" : "");
      if (!failed && data.tool_calls?.length) m.append(el("div", "mini-trace", `${plural(data.tool_calls.length, "step")}, ${plural(data.tool_calls.filter(c => c.type === "tool").length, "tool call")}: I need a bit more before I can price it.`));
    }
  } catch (e) {
    done();
    addText(e.name === "AbortError" ? "That took too long. Please try again." : `Couldn't reach the server: ${e.message}`, "error");
  } finally {
    clearTimeout(timeout);
    busy = false; send.disabled = false; input.focus();
  }
}

// --- trace replay: Lead -> researchers side by side -> Writer, then the memo ---
function researcherRuns(calls) {
  const runs = [];
  let round = 0;
  const open = {};
  for (const c of calls) {
    if (c.agent === "lead" && c.name.startsWith("dispatch_researchers")) round += 1;
    if (!c.agent.startsWith("researcher")) continue;
    const r = json(c.result) || {};
    if (c.name.startsWith("search_")) {
      const lines = Object.values(r.listings_to_review || {}).flat().length + (r.offers_to_review || []).length;
      open[c.agent] = { agent: c.agent, round: Math.max(round, 1), query: c.args?.query || "", found: lines + (r.dropped_in_code || []).length };
    } else if (c.name.startsWith("review_listings")) {
      const run = open[c.agent] || { agent: c.agent, round: Math.max(round, 1), query: "", found: r.n_before_review };
      run.kept = r.n_kept;
      if (r.n_found != null) run.found = r.n_found;  // every listing this researcher saw, across its searches
      runs.push(run);
      delete open[c.agent];
    }
  }
  return runs;
}

function replay(calls, memo) {
  const runs = researcherRuns(calls);
  if (reduced || !runs.length) return Promise.resolve();
  return new Promise(resolve => {
    const box = el("div", "replay");
    box.innerHTML = `<div class="replay-head"><h3>Researching…</h3><a href="#" class="skip">Skip to the price →</a></div>`;
    const lead = calls.find(c => c.name === "assess_item");
    const product = json(lead?.result)?.item?.product || memo.item?.product || "your item";
    const steps = [];
    const leadCard = el("div", "rcard", `${agentPill("lead")}<div>Read the item: <b>${esc(product)}</b>. Sent ${plural(runs.filter(r => r.round === 1).length, "researcher")} out in parallel${memo.rounds > 1 ? `, then ${plural(memo.rounds - 1, "more round")}` : ""}.</div>`);
    box.append(leadCard);
    steps.push(() => leadCard.classList.add("on"));
    for (const rd of [...new Set(runs.map(r => r.round))]) {
      const arrow = el("div", "rarrow", rd === 1 ? "↓ in parallel, each in a fresh context" : `↓ round ${rd}: filling gaps`);
      const grid = el("div", "rgrid");
      box.append(arrow, grid);
      steps.push(() => arrow.classList.add("on"));
      const cards = runs.filter(r => r.round === rd).map(r => {
        const unit = r.agent.endsWith("retail") ? "offers" : "listings";
        const card = el("div", "rcard", `${agentPill(r.agent).replace("Researcher · ", "")}
          <div class="q">"${esc(r.query)}"</div><div class="n"><span class="k">0</span> kept <span class="muted small">of ${r.found ?? "?"} ${unit}</span></div><div class="meter"><i></i></div>`);
        grid.append(card);
        return [card, r];
      });
      steps.push(() => cards.forEach(([card, r], i) => setTimeout(() => {
        card.classList.add("on");
        card.querySelector(".meter i").style.width = r.found ? `${Math.round(100 * (r.kept || 0) / r.found)}%` : "0%";
        countUp(card.querySelector(".k"), r.kept || 0, 700);
      }, i * 140)));
    }
    const writerArrow = el("div", "rarrow", "↓");
    const check = memo.citation_check || {};
    const writer = el("div", "rcard", `${agentPill("writer")}<div>Drafted the memo from ${plural(memo.comps_kept, "kept comp")}; ${plural(check.cited?.length || 0, "citation")} checked against the sources.</div>`);
    box.append(writerArrow, writer);
    steps.push(() => { writerArrow.classList.add("on"); writer.classList.add("on"); });
    const node = addBot(box);

    const gap = 2600 / (steps.length + 1);  // about 2.6s in all, whatever the number of rounds
    const timers = steps.map((s, i) => setTimeout(() => { s(); scrollDown(); }, 150 + i * gap));
    const finish = () => { timers.forEach(clearTimeout); clearTimeout(end); node.remove(); resolve(); };
    const end = setTimeout(finish, 150 + steps.length * gap + 500);
    box.querySelector(".skip").onclick = e => { e.preventDefault(); finish(); };
  });
}
function countUp(node, to, ms) {
  const start = performance.now();
  const step = t => { const k = Math.min(1, (t - start) / ms); node.textContent = Math.round(to * k); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// --- memo ---
// A sticker pill: a soft color and a tilt within ±2°, taken from its text so it stays put on re-render.
const STICKER_COLORS = ["coral", "mustard", "sky", "sage"];
function stickerAttrs(text, color) {
  let h = 0;
  for (const ch of String(text)) h = (h * 31 + ch.charCodeAt(0)) | 0;
  const tilt = ((Math.abs(h) % 41) - 20) / 10;  // -2.0 .. 2.0 degrees
  return `class="pill sticker ${color}" style="--tilt:${tilt}deg"`;
}
function confidencePill(c) {
  const n = { low: 1, medium: 2, high: 3 }[c] || 0;
  const color = { low: "coral", medium: "mustard", high: "sage" }[c] || "sky";
  return `<span ${stickerAttrs(c + " confidence", color)}><span class="lvl" aria-hidden="true">${[1, 2, 3].map(i => `<b class="${i <= n ? "on" : ""}"></b>`).join("")}</span>${esc(c[0].toUpperCase() + c.slice(1))} confidence</span>`;
}

function renderMemo(m, calls, openTrace) {
  const wrap = el("article", "memo");
  const item = m.item || {};
  const range = `${price(m.price_low)} – ${price(m.price_high)}`;
  const itemLine = [item.product, item.variant, CONDITIONS[item.condition] || item.condition, item.condition_detail].filter(Boolean).join(" · ");

  const tagwrap = el("div", "tagwrap", `<svg class="string" viewBox="0 0 80 74" aria-hidden="true"><path d="M4 2 C 20 30, 30 50, 60 66" fill="none" stroke="var(--muted)" stroke-width="1.6"/></svg><div class="tag">
      <div class="eyebrow">Suggested asking price</div>
      <div class="price">${range}</div>
      <div class="item">${esc(itemLine)}</div>
      <div class="row">${confidencePill(m.confidence)}
        <button class="btn copy" type="button">Copy price</button>
        <button class="btn primary drafter" type="button">Draft my listing</button></div>
    </div>`);
  wrap.append(tagwrap, el("div", "disclaimer", "A competitive asking price from active listings, not a prediction of what it will sell for."));
  const copyBtn = tagwrap.querySelector(".copy");
  copyBtn.onclick = () => copy(range.replace(" – ", "–"), copyBtn, "Copy price");

  // trace summary strip, right under the tag
  const researchers = calls.find(c => c.name.startsWith("dispatch_researchers"))?.args?.briefs?.length || researcherRuns(calls).filter(r => r.round === 1).length;
  const tools = calls.filter(c => c.type === "tool").length;
  const sep = '<span class="sep" aria-hidden="true">|</span>';
  const stripBtn = el("button", "strip-link", `<span>🔍 ${plural(researchers, "researcher")} in parallel</span>${sep}<span>${plural(tools, "tool call")}</span>${sep}
    <span>${plural(m.rounds || 1, "round")}</span>${sep}<span>${m.comps_kept} of ${m.comps_found} listings kept</span><span class="go">How I researched this ↓</span>`);
  stripBtn.type = "button";
  wrap.append(stripBtn);

  // the memo: takeaway, Why, Watch out, then one short Assumed line (bullets only when several)
  const body = el("div", "memo-body");
  const list = xs => `<ul>${xs.map(x => `<li>${cite(x, m)}</li>`).join("")}</ul>`;
  const assumed = m.assumptions || [];
  body.innerHTML = `<p class="headline">${cite(m.headline, m)}</p>
    <p class="confline">${esc(m.confidence[0].toUpperCase() + m.confidence.slice(1))} confidence: ${cite(m.confidence_reason, m)}</p>
    <hr class="divider"><h3>Why</h3>${list(m.why || [])}
    ${(m.watch_out || []).length ? `<h3>Watch out</h3>${list(m.watch_out)}` : ""}
    ${assumed.length ? `<div class="assumed"><i>Assumed: ${assumed.length <= 2 ? assumed.map(esc).join(" ")
      : `</i><ul>${assumed.map(a => `<li><i>${esc(a)}</i></li>`).join("")}</ul><i>`}</i></div>` : ""}`;
  const draftSlot = el("div");
  body.append(draftSlot);
  wrap.append(body);
  const drafter = tagwrap.querySelector(".drafter");
  drafter.onclick = () => draftListing(m, drafter, draftSlot);

  // receipt-style dashed rules between the memo, the detail sections and the trace
  wrap.append(el("hr", "rule"), compsSection(m), conditionSection(m), retailSection(m), sourcesSection(m));
  const trace = traceSection(calls, m, openTrace);
  wrap.append(el("hr", "rule"), trace);
  stripBtn.onclick = () => { trace.open = true; trace.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "start" }); };
  return wrap;
}

function fold(title, peek, body) {
  const d = el("details", "fold");
  d.innerHTML = `<summary><h3 class="section-title">${title}</h3><span class="peek">${peek}</span></summary>`;
  const b = el("div", "foldbody");
  if (typeof body === "string") b.innerHTML = body; else b.append(body);
  d.append(b);
  return d;
}

function compsSection(m) {
  const body = el("div");
  // Groups come from the server ("different model: Max" + "different model: Pro 1" -> one pill,
  // details on hover): the same data as the memo's exclusion sentence, so the counts agree.
  const reasons = m.excluded_groups || [];
  const excludedN = m.comps_excluded ?? reasons.reduce((a, g) => a + g.n, 0);
  const g = m.grade;
  const gradeLine = g ? `<p class="small muted">Your grade: <b>${esc(g.label)}</b>. ${g.n_matching} of ${g.n} comps match it (${Object.entries(g.by_grade).map(([k, n]) => `${n} ${esc(k)}`).join(", ")}).
    All stay in the set; they're weighted toward your grade${g.weighted_median != null ? `, for a weighted median of ${money(g.weighted_median)}` : ""}${g.differs ? ` vs ${money(g.used_median)} for all comps` : ""}.</p>` : "";
  // the statistics live here, not in the memo prose
  const cm = m.comp_median || {};
  // "33 listings from 28 sellers, each seller counted once ... Median ...; middle half ...": built on the server
  const caption = cm.caption ? `<p class="small muted">${esc(cm.caption)}</p>` : "";
  body.innerHTML = `${priceStrip(m)}${caption}${gradeLine}
    <div class="funnel"><div><b>${m.comps_found}</b><span>found on eBay</span></div><div><b>${m.comps_after_title_filter}</b><span>after title filter</span></div><div><b>${m.comps_kept}</b><span>kept after review</span></div></div>
    ${reasons.length ? `<div class="small muted" style="margin-bottom:6px">Filtered out (${excludedN}) and why</div><div class="pills" style="margin-bottom:14px">${reasons.map((r, i) => `<span ${stickerAttrs(r.label, STICKER_COLORS[i % STICKER_COLORS.length])} title="${esc(r.details.join(", "))}"><b>${r.n}</b> ${esc(r.label)}</span>`).join("")}</div>` : ""}`;
  body.append(compsTable(m));
  return fold("Comparable listings", `${m.comps_kept} kept of ${m.comps_found} · ${excludedN} filtered out`, body);
}

function compsTable(m) {
  const wrap = el("div");
  const rows = m.comps || [];
  const LIMIT = 10;
  const row = c => `<tr><td>${c.image ? `<img class="thumb" src="${esc(c.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<div class="thumb"></div>`}</td>
    <td class="title"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a> ${cite(`[${c.id}]`, { sources: { [c.id]: c } })}${c.best_offer ? '<span class="mini">best offer</span>' : ""}</td>
    <td class="num hide-sm">${money(c.price)}</td><td class="num hide-sm">${c.shipping == null ? "?" : c.shipping === 0 ? "free" : money(c.shipping)}</td><td class="num">${money(c.total)}</td></tr>`;
  const spread = rows.length <= LIMIT ? rows : Array.from({ length: LIMIT }, (_, i) => rows[Math.round(i * (rows.length - 1) / (LIMIT - 1))]);
  const draw = list => `<div class="tablewrap"><table><thead><tr><th><span class="sr">Photo</span></th><th>Listing</th>
    <th class="num hide-sm">Price</th><th class="num hide-sm">Ship</th><th class="num">Total</th></tr></thead><tbody>${list.map(row).join("")}</tbody></table></div>`;
  wrap.innerHTML = (rows.length > LIMIT ? `<div class="small muted" style="margin-bottom:4px">${LIMIT} of ${rows.length}, spread from cheapest to priciest</div>` : "") + draw(spread);
  if (rows.length > LIMIT) {
    const b = el("button", "btn", `Show all ${rows.length}`);
    b.type = "button"; b.style.marginTop = "12px";
    b.onclick = () => { wrap.innerHTML = draw(rows); };
    wrap.append(b);
  }
  return wrap;
}

// every kept comp on a price line, with the suggested range as the accent band
function priceStrip(m) {
  const cm = m.comp_median || {};
  const onTotal = cm.basis !== "item_price";
  // each dot on the median's basis; hollow = not in the median (shipping not stated)
  const comps = (m.comps || []).map(c => ({ ...c, x: onTotal ? (c.total ?? c.price) : c.price, known: c.in_median ?? c.total != null })).filter(c => c.x != null);
  if (!comps.length) return "";
  const xs = comps.map(c => c.x).concat([m.price_low, m.price_high]);
  let lo = Math.min(...xs), hi = Math.max(...xs);
  const pad = (hi - lo) * 0.06 || 5; lo = Math.max(0, lo - pad); hi += pad;
  const W = innerWidth < 640 ? 340 : 640, H = 74, L = 8, R = 8, y = 38;
  const sx = v => L + (v - lo) / (hi - lo) * (W - L - R);
  const dots = comps.map((c, i) => `<a href="${esc(c.url)}" target="_blank" rel="noopener"><circle cx="${sx(c.x).toFixed(1)}" cy="${(y + ((i * 37) % 9 - 4) * 1.6).toFixed(1)}" r="4.2"
      fill="${c.known ? "var(--dot)" : "var(--surface)"}" stroke="${c.grade_match ? "var(--rust)" : "var(--dot)"}" stroke-width="${c.grade_match ? 2.4 : 1.3}"><title>${esc(c.id)}: ${esc(c.title)} · ${money(c.x)}${c.grade ? ` · ${esc(c.grade)}` : ""}</title></circle></a>`).join("");
  const med = cm.median != null ? `<line x1="${sx(cm.median)}" x2="${sx(cm.median)}" y1="22" y2="54" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="3 2"/>` : "";
  const graded = comps.some(c => c.grade_match);
  const basisText = onTotal ? "price with shipping" : "item price";
  const medText = cm.median == null ? "" : ` Dashed line: the median, ${money(cm.median)}.`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${comps.length} kept comps; suggested range ${price(m.price_low)} to ${price(m.price_high)}">
    <rect x="${sx(m.price_low)}" y="18" width="${Math.max(3, sx(m.price_high) - sx(m.price_low))}" height="40" rx="6" fill="var(--accent-soft)" stroke="var(--accent-line)"/>
    <line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line-strong)"/>
    ${ticks(lo, hi, W < 400 ? 3 : 5).map(t => `<text x="${sx(t)}" y="${H - 2}" text-anchor="middle">${price(t)}</text>`).join("")}
    ${med}${dots}
    <text class="acc" x="${(sx(m.price_low) + sx(m.price_high)) / 2}" y="12" text-anchor="middle">your range</text>
  </svg><div class="legend">Each dot is a kept listing, ${basisText}${" (hollow: not in the median: " + (onTotal ? "shipping not stated, or " : "") + "another listing from the same seller)"}.${graded ? ` Ringed dots match your grade (${esc(m.grade.label)}).` : ""}${medText}</div>`;
}
function ticks(lo, hi, n) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) out.push(t);
  return out;
}

// condition ladder: your condition from the exact comps (the memo's figures), the rest from the broader condition search
function conditionSection(m) {
  const tiers = m.condition_tiers || [];
  if (!tiers.length) return el("div");
  const mine = m.item?.condition;
  const name = t => CONDITIONS[t] || t;
  const W = innerWidth < 640 ? 340 : 640, rowH = 32, top = 22, labelW = W < 400 ? 70 : 92, valW = 76;
  const H = top + tiers.length * rowH + 20;
  const max = Math.max(...tiers.map(t => t.q3 ?? t.median), m.price_high) * 1.05;
  const sx = v => labelW + v / max * (W - labelW - valW);
  const bars = tiers.map((t, i) => {
    const y = top + i * rowH, you = t.condition === mine;
    return `<g><text class="${you ? "you" : "lbl"}" x="${labelW - 10}" y="${y + 16}" text-anchor="end">${esc(name(t.condition))}</text>
      <rect x="${labelW}" y="${y + 5}" width="${Math.max(2, sx(t.median) - labelW)}" height="16" rx="3" fill="${you ? "var(--bar-you)" : "var(--bar)"}"/>
      <line x1="${sx(t.q1)}" x2="${sx(t.q3)}" y1="${y + 13}" y2="${y + 13}" stroke="var(--muted)" stroke-width="1.2"/>
      <text class="${you ? "you" : ""}" x="${sx(Math.max(t.median, t.q3 ?? t.median)) + 6}" y="${y + 17}">${money(t.median)}</text>
      <title>${esc(name(t.condition))}: median ${money(t.median)}, middle half ${money(t.q1)}–${money(t.q3)}, ${t.of != null && t.n < t.of ? `${t.n} of ${t.of} listings (those that list shipping)` : `${t.n} listings`}${t.source === "exact_comps" ? " (your exact comps)" : " (broader condition search)"}</title></g>`;
  }).join("");
  const band = `<rect x="${sx(m.price_low)}" y="${top - 4}" width="${Math.max(3, sx(m.price_high) - sx(m.price_low))}" height="${tiers.length * rowH + 4}" rx="4" fill="var(--accent-soft)" stroke="var(--accent-line)"/>
    <text class="acc" x="${(sx(m.price_low) + sx(m.price_high)) / 2}" y="${top - 9}" text-anchor="middle">your range</text>`;
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Median asking price by condition; yours is ${esc(name(mine))}">
    ${band}${bars}<text x="${labelW}" y="${H - 2}">$0</text><text x="${W - valW}" y="${H - 2}" text-anchor="end">${price(Math.round(max))}</text></svg>
    <div class="legend">Bar: median asking price; line: middle half of listings. <b>${esc(name(mine))}</b> uses your exact comps, the same figures as the memo. The other conditions come from a broader condition search.</div>`;
  const table = `<div class="tablewrap"><table><thead><tr><th>Condition</th><th class="num">Listings</th><th class="num">Median</th><th class="num hide-sm">Middle half</th><th class="hide-sm">From</th></tr></thead>
    <tbody>${tiers.map(t => `<tr><td>${t.condition === mine ? `<b>${esc(name(t.condition))}</b>` : esc(name(t.condition))}</td><td class="num">${t.of != null && t.n < t.of ? `${t.n} of ${t.of}` : t.n}</td><td class="num">${money(t.median)}</td>
      <td class="num hide-sm">${money(t.q1)}–${money(t.q3)}</td><td class="hide-sm small muted">${t.source === "exact_comps" ? "your exact comps" : "broader condition search"}</td></tr>`).join("")}</tbody></table></div>`;
  const mineRow = tiers.find(t => t.condition === mine);
  return fold("Price by condition", mineRow ? `${esc(name(mine))} median ${money(mineRow.median)}` : plural(tiers.length, "condition"), svg + table);
}

function retailSection(m) {
  const ref = m.retail_reference;
  let body = "", peek;
  if (ref) {
    const model = ref.successor ? "the successor model's " : "";
    // a single offer is cited; a median ceiling names its basis
    const link = ref.id ? cite(`[${ref.id}]`, m) : `<span class="small muted">(${esc(ref.basis || "")})</span>`;
    const x = ref.resale_to_retail_ratio;
    body += ref.role === "premium"
      ? `<p><span ${stickerAttrs("Resale premium", "mustard")}>Resale premium</span> Used listings ask <b>${x.toFixed(2)}×</b> ${model}retail price (${money(ref.comp_median)} vs ${money(ref.price)} ${link}), so the price comes from comps alone.</p>`
      : `<p>Resale-to-retail ratio <b>${x?.toFixed(2) ?? "?"}</b>: comps sit below ${model}retail ceiling, ${money(ref.price)}${ref.id ? ` at ${esc(ref.retailer)}` : ""} ${link}.</p>`;
    if (ref.lowest_note) body += `<p class="small muted">${cite(ref.lowest_note, m)}</p>`;
    if (ref.successor) body += `<p class="small muted">${esc(m.retail_status?.note || "No current retail price for this exact model, so this is its successor: a looser ceiling.")}</p>`;
    peek = `${ref.role === "premium" ? "premium" : "ceiling"} ${money(ref.price)}${x ? ` · ratio ${x.toFixed(2)}` : ""}`;
  }
  // new-below-retail is a Why bullet in the memo, so it isn't repeated here
  if (m.retail?.length) {
    body += `<div class="tablewrap"><table><thead><tr><th>Retailer</th><th>Offer</th><th class="num">Price</th><th class="num hide-sm">Was</th></tr></thead>
      <tbody>${m.retail.map(x => `<tr><td>${esc(x.retailer)}</td><td class="title"><a href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(x.listed_as || x.title)}">${esc(x.title)}</a> ${cite(`[${x.id}]`, m)}${x.model_note ? `<div class="small muted">${esc(x.model_note)}</div>` : ""}</td>
      <td class="num">${money(x.price)}</td><td class="num hide-sm">${x.old_price ? money(x.old_price) : ""}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    // the server's note: boutique-only (Chanel, Hermès, Rolex) is not "discontinued"
    const st = m.retail_status || {};
    body += `<p>${esc(st.note || (m.no_new_retail_found ? "No new retail found: Google Shopping returned only resale listings, so the item is likely discontinued. The price comes from comps alone." : "No current new retail price found online. The price comes from comps alone."))}</p>`;
    peek = { boutique_only: "boutique only", discontinued: "likely discontinued", no_mainstream: "no mainstream price", search_failed: "search failed" }[st.status] || "none found";
  }
  return fold("Retail (new)", peek, body);
}

function sourcesSection(m) {
  const srcs = Object.entries(m.sources || {});
  const check = m.citation_check || {};
  const body = `${check.warnings?.length ? `<div class="warn">${check.warnings.map(esc).join("<br>")}</div>` : ""}
    <p class="small muted">Citation check: ${plural(check.cited?.length || 0, "source")} cited, ${plural(check.unknown_tags_stripped?.length || 0, "invalid tag")} removed. Every tag links to a listing a tool returned.</p>
    <ul class="srclist">${srcs.map(([id, s]) => `<li>${cite(`[${id}]`, m)} <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a> <span class="small muted">· ${esc(s.detail)} · ${money(s.price)}</span></li>`).join("")}</ul>`;
  return fold("Sources", `${srcs.length} · ${check.cited?.length || 0} cited${check.warnings?.length ? ` · ${plural(check.warnings.length, "warning")}` : ""}`, body);
}

// the research trace, grouped by agent
function traceSection(calls, m, open) {
  const d = el("details", "trace");
  d.open = open;
  const tools = calls.filter(c => c.type === "tool").length;
  d.innerHTML = `<summary><h3>How I researched this</h3><span class="peek">${plural(calls.length, "step")} · ${plural(tools, "tool call")} · ${plural(m.rounds || 1, "round")}</span><span class="chev">Show / hide</span></summary>`;
  const body = el("div", "tracebody", `<div class="trace-note">Every number in the memo comes from these tool calls. <b>Tool</b>: an agent called it. <b>Step</b>: code ran it (intake result, citation check, fallbacks).</div>`);
  const order = ["lead", "researcher:exact_comps", "researcher:condition_tiers", "researcher:retail", "writer"];
  const agents = [...new Set(calls.map(c => c.agent))].sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  for (const a of agents) {
    const mine = calls.filter(c => c.agent === a);
    const nTools = mine.filter(c => c.type === "tool").length, nSteps = mine.length - nTools;
    const g = el("div", "group", `<div class="group-head">${agentPill(a)}<span class="small muted">${plural(nTools, "tool call")}${nSteps ? `, ${plural(nSteps, "step")}` : ""}</span></div>`);
    for (const c of mine) {
      const kind = c.type === "tool" ? "tool" : "step";
      const args = typeof c.args === "string" ? c.args : JSON.stringify(c.args, null, 1);
      const parsed = json(c.result);
      const result = parsed ? JSON.stringify(parsed, null, 1) : (c.result ?? "");
      g.append(el("div", `entry ${kind}`, `<span class="name">${esc(c.name)}</span><span class="kind ${kind}">${kind}</span>
        <details><summary>${esc(summarize(c))}</summary><pre>${esc(args)}</pre><pre>${esc(result)}</pre></details>`));
    }
    body.append(g);
  }
  d.append(body);
  return d;
}
function summarize(c) {
  const a = c.args || {}, r = json(c.result) || {};
  if (c.name.startsWith("dispatch_researchers")) return (a.briefs || []).map(b => `${b.researcher}: "${b.query}"${b.broadened ? " (broadened)" : ""}`).join(" · ") || "details";
  if (c.name.startsWith("search_ebay")) return `"${a.query}" · ${(a.conditions || []).join(", ")}`;
  if (c.name.startsWith("search_retail")) return `"${a.query}"`;
  // from the result, so kept + excluded = reviewed (ids the reviewer named twice or got wrong don't count)
  if (c.name.startsWith("review_listings")) {
    const ignored = r.unknown_ids_ignored?.length ? ` · ${r.unknown_ids_ignored.length} unknown id${r.unknown_ids_ignored.length === 1 ? "" : "s"} ignored` : "";
    const code = r.n_dropped_in_code ? ` (${r.n_dropped_in_code} more dropped in code)` : "";
    return `reviewed ${r.n_before_review ?? "?"}: kept ${r.n_kept ?? "?"}, excluded ${r.n_excluded_in_review ?? "?"}${code}${ignored}`;
  }
  if (c.name === "assess_item") return r.ready ? `ready: ${r.item?.product || ""}` : "needs more detail";
  if (c.name === "validate_citations") return `${plural(r.cited?.length || 0, "citation")} valid, ${plural(r.unknown_tags_stripped?.length || 0, "invalid tag")} removed`;
  if (c.name === "recount") return r.revised ? "comp counts corrected" : "comp counts left as drafted";
  if (c.name === "takeaway: rewritten by code") return r.reason || "details";
  return "details";
}

// --- draft my listing ---
async function draftListing(m, btn, slot) {
  btn.disabled = true; btn.textContent = "Drafting…";
  try {
    const res = await fetch("/draft", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ memo: m }) });
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    const d = await res.json();
    const draft = { title: d.title, description: realNewlines(d.description) };
    slot.innerHTML = `<div class="draft"><h3>Your listing draft</h3>
      <div class="dtitle">${esc(draft.title)}</div><div class="small muted">${draft.title.length}/80 characters</div>
      <div class="desc">${esc(draft.description)}</div>
      <p class="small muted">List at <b>${money(d.price)}</b>: ${esc(d.price_note)} Fill in anything in [brackets] before posting.</p>
      <div class="row"><button class="btn" type="button" data-copy="title">Copy title</button><button class="btn" type="button" data-copy="description">Copy description</button></div></div>`;
    slot.querySelectorAll("[data-copy]").forEach(b => { const label = b.textContent; b.onclick = () => copy(draft[b.dataset.copy], b, label); });
    slot.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" });
    btn.textContent = "Redraft";
  } catch (e) {
    slot.innerHTML = `<div class="warn" style="margin-top:14px">Couldn't draft the listing: ${esc(e.message)}</div>`;
    btn.textContent = "Draft my listing";
  } finally {
    btn.disabled = false;
  }
}

// --- input, reset, theme ---
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
document.getElementById("reset").onclick = () => {
  if (busy) return;
  if (sessionId) fetch(`/clear?session_id=${encodeURIComponent(sessionId)}`, { method: "POST" }).catch(() => {});
  sessionId = null; answers = 0;
  log.innerHTML = "";
  intro();
  input.focus();
};
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("theme")); } catch {}
document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(dark ? "light" : "dark");
  try { localStorage.setItem("theme", dark ? "light" : "dark"); } catch {}
};

// The composer is fixed: pad the page by its real height (it grows as the textarea does)
const footer = document.querySelector("footer");
const setComposerHeight = () => document.documentElement.style.setProperty("--composer-h", `${footer.offsetHeight}px`);
new ResizeObserver(setComposerHeight).observe(footer);
setComposerHeight();

intro();
input.focus();
</script>
